name: CLIProxyAPI provider integration

on:
  pull_request:
    branches: [claude]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Verify gateway URL and image translation
        run: node --import tsx --test server/lib/cliProxy.test.ts server/lib/cliProxyResearch.test.ts server/services/codexQuality.test.ts server/services/codexMemories.test.ts server/services/codexV2Plan.test.ts server/services/codexV2.test.ts server/services/codexV3Knowledge.test.ts server/services/codexV3.test.ts src/lib/codexDisplay.test.ts
