name: Book metadata checks

on:
  pull_request:
    paths:
      - 'server.ts'
      - 'src/services/bookMetadataServer.ts'
      - 'src/services/bookMetadataServer.test.ts'
      - 'src/services/integrations.ts'
      - 'src/components/MediaFormModal.tsx'
      - 'src/components/SettingsModal.tsx'
      - 'src/types/schema.ts'
      - 'package.json'
      - '.github/workflows/book-metadata.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:books
      - run: npm run lint
      - run: npm run build
